name: Build OmaxFX Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/omaxfx-windows-desktop
    paths:
      - 'src/**'
      - 'public/**'
      - 'electron/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/build-windows-desktop.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run automated regression tests
        run: npm test

      - name: Build compressed Windows installer
        run: npm run dist:win

      - name: Publish public OmaxFX release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: OmaxFX Simulator v1.0.0 (Build ${{ github.run_number }})
          body: |
            Official OmaxFX Simulator for Windows.

            - Offline desktop application
            - Windows x64 installer
            - Automatically generated from the latest successful desktop build

            Download **OmaxFX-Simulator.exe** below.
          files: release/OmaxFX-Simulator.exe
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
