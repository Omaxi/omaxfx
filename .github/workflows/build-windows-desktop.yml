name: Build OmaxFX Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/omaxfx-windows-desktop
    paths:
      - 'src/**'
      - 'public/**'
      - 'electron/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/build-windows-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OmaxFX-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
